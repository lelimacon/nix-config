version: '3'


vars:
  HOST_NAME:
    sh: hostname
  FLAKE_PATH: "../hosts/{{.HOST_NAME}}"


tasks:

  init-nixos:
    desc: "Initialize."
    internal: true
    cmds:
      # Open dev shell.
      - nix-shell -p git vscodium
      # Download repo.
      - git clone https://github.com/lelimacon/nix-config.git
      # Apply configuration (from host flake directory).
      - sudo env NIX_CONFIG="experimental-features = nix-command flakes" nixos-rebuild switch --flake .#ff08-amd

  check:
    desc: "Validate configuration."
    dir: "{{.FLAKE_PATH}}"
    cmds:
      - nix flake check --impure

  trace:
    desc: "Show configuration changes."
    dir: "{{.FLAKE_PATH}}"
    cmds:
      - sudo nixos-rebuild switch --show-trace

  update:
    desc: "Update the lock file."
    dir: "{{.FLAKE_PATH}}"
    cmds:
      - nix flake update

  switch:
    desc: "Build configuration, make it default, and switch."
    platforms: [linux]
    cmds:
      - sudo nixos-rebuild switch --flake "{{.FLAKE_PATH}}#{{.HOST_NAME}}"

  test:
    desc: "Build configuration, switch, but don't add it to the bootloader menu."
    platforms: [linux]
    cmds:
      - sudo nixos-rebuild test --flake "{{.FLAKE_PATH}}#{{.HOST_NAME}}"

  boot:
    desc: "Build configuration, make it default, but switch on next boot."
    silent: true
    platforms: [linux]
    cmds:
      - sudo nixos-rebuild boot --flake "{{.FLAKE_PATH}}#{{.HOST_NAME}}"
