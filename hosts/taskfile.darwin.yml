version: '3'


vars:
  HOST_NAME:
    sh: scutil --get HostName
  FLAKE_PATH: "../hosts/{{.HOST_NAME}}"


tasks:

  init-darwin:
    desc: "Initialize."
    internal: true
    cmds:
      # Install Homebrew.
      - /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      # Install nix.
      - sh <(curl --proto '=https' --tlsv1.2 -L https://nixos.org/nix/install)
      # Apply configuration.
      - sudo nix run --extra-experimental-features nix-command --extra-experimental-features flakes nix-darwin -- switch --flake .#mox-air-m4

  check:
    desc: "Validate configuration."
    dir: "{{.FLAKE_PATH}}"
    cmds:
      - nix flake check --impure

  update:
    desc: "Update the lock file."
    dir: "{{.FLAKE_PATH}}"
    cmds:
      - nix flake update

  switch:
    desc: "Build configuration, make it default, and switch."
    platforms: [darwin]
    cmds:
      - sudo darwin-rebuild switch --flake "{{.FLAKE_PATH}}#{{.HOST_NAME}}"
