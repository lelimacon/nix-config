version: '3'


includes:
  ext:
    taskfile: ./ext
    dir: ./ext
  host:
    taskfile: ./hosts/taskfile.yml
    dir: ./hosts


tasks:

  show:
    desc: "Show configuration and generations."
    cmds:
      - nix flake metadata
      - nix flake show
      - task: system:show

  list:
    desc: "List packages installed in system profile."
    cmds:
      - nix-env -qaP

  check:
    desc: "Validate configuration."
    cmds:
      - nix flake check --impure

  diff:
    desc: "Build system configuration, do not activate but show changes."
    cmds:
      - task: system:diff

  update:
    desc: "Update all flake inputs and reconcile host locks."
    cmds:
      - nix flake update
      - task: system:lock

  lock:
    desc: "Reconcile flake.lock without upgrading inputs."
    cmds:
      - nix flake lock
      - task: system:lock
